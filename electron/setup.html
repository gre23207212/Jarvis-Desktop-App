<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Jarvis Setup</title>
<style>
  @font-face { font-family: hud; src: local("Bahnschrift"), local("Segoe UI"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; font-family: "Segoe UI", sans-serif; color: #d9f6ff; user-select: none; }
  .win { position: absolute; inset: 6px; background: radial-gradient(120% 90% at 85% 0%, #06283a 0%, #030b12 60%); border: 1px solid #1ec8ff55;
    clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); display: flex; flex-direction: column; }
  .win::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, #ffffff04 0 1px, transparent 1px 3px); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; -webkit-app-region: drag; border-bottom: 1px solid #1ec8ff22; }
  header h1 { font-family: hud, sans-serif; font-size: 13px; letter-spacing: .3em; color: #33d6ff; font-weight: 700; }
  header button { -webkit-app-region: no-drag; background: none; border: 0; color: #6d93a3; font-size: 16px; cursor: pointer; padding: 2px 6px; }
  header button:hover { color: #33d6ff; }
  main { flex: 1; display: flex; padding: 22px 26px 0; gap: 18px; }
  .text { flex: 1; display: flex; flex-direction: column; }
  h2 { font-family: hud, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: .02em; color: #fff; text-shadow: 0 0 18px #1ec8ff66; }
  p { margin-top: 14px; font-size: 13px; line-height: 1.55; color: #9cc3d1; }
  .logo { width: 140px; height: 140px; filter: drop-shadow(0 0 18px #1ec8ffaa); animation: spin 14s linear infinite; }
  .busy .logo { animation-duration: 2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  label { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #b9dbe6; margin-top: 10px; cursor: pointer; }
  input { accent-color: #1ec8ff; }
  .bar { height: 6px; border: 1px solid #1ec8ff66; margin-top: 16px; display: none; }
  .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #0b8fd6, #33d6ff); box-shadow: 0 0 10px #33d6ff; transition: width .3s; }
  .busy .bar { display: block; }
  .status { font-family: Consolas, monospace; font-size: 11px; color: #33d6ff; margin-top: 8px; min-height: 14px; }
  .note { font-size: 11px; color: #5f8796; margin: auto 0 14px; }
  footer { display: flex; justify-content: flex-end; gap: 12px; padding: 14px 26px 20px; border-top: 1px solid #1ec8ff22; margin: 0 0 0; }
  .btn { font-family: hud, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .08em; padding: 11px 26px; cursor: pointer; border: 1px solid #1ec8ff66; background: transparent; color: #9cc3d1;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%); }
  .btn:hover { background: #1ec8ff14; color: #fff; }
  .primary { background: #1ec8ff; color: #021018; border-color: #1ec8ff; min-width: 180px; }
  .primary:hover { background: #5be0ff; color: #021018; }
  .danger { background: #ff4d5e; border-color: #ff4d5e; color: #1a0306; }
  .danger:hover { background: #ff7180; color: #1a0306; }
  .btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="win" id="win">
  <header><h1 id="title">INSTALL JARVIS</h1><div><button onclick="jarvisSetup.min()">–</button><button onclick="jarvisSetup.close()">✕</button></div></header>
  <main>
    <div class="text">
      <h2 id="head">At your service.</h2>
      <p id="body"></p>
      <div id="opts"></div>
      <div class="bar"><div id="fill"></div></div>
      <div class="status" id="status"></div>
      <div class="note" id="note"></div>
    </div>
    <img class="logo" src="icon.png" alt="" />
  </main>
  <footer><button class="btn" id="cancel" onclick="jarvisSetup.close()">Cancel</button><button class="btn primary" id="go"></button></footer>
</div>
<script>
  const mode = new URLSearchParams(location.search).get("mode") || "install";
  const $ = (id) => document.getElementById(id);
  if (mode === "install") {
    $("body").innerHTML = "Jarvis will be installed for this Windows user, with a taskbar-ready icon,<br>a desktop shortcut and a Start menu entry.";
    $("opts").innerHTML = '<label><input type="checkbox" id="desk" checked> Create a desktop shortcut</label><label><input type="checkbox" id="boot"> Start Jarvis when Windows starts</label>';
    $("note").textContent = "No admin rights needed. Installs to your user folder.";
    $("go").textContent = "Install Jarvis";
  } else {
    $("title").textContent = "REMOVE JARVIS";
    $("head").textContent = "Powering down, sir.";
    $("body").innerHTML = "Remove Jarvis and its shortcuts for this Windows user.<br>Jarvis will close itself before he's removed.";
    $("note").textContent = "Your settings and downloaded local brain are kept.";
    $("go").textContent = "Remove Jarvis";
    $("go").classList.add("danger");
  }
  jarvisSetup.onProgress(({ text, pct }) => { $("status").textContent = text; if (pct != null) $("fill").style.width = Math.round(pct * 100) + "%"; });
  $("go").onclick = async () => {
    $("win").classList.add("busy");
    $("go").disabled = $("cancel").disabled = true;
    const opts = mode === "install" ? { desktop: $("desk").checked, startup: $("boot").checked } : {};
    const r = await jarvisSetup.run(mode, opts);
    if (r && r.error) { $("status").textContent = "✗ " + r.error; $("go").disabled = $("cancel").disabled = false; $("win").classList.remove("busy"); }
  };
</script>
</body>
</html>
