name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: Jarvis-Desktop-win32-x64
          - os: macos-latest
            target: mac
            artifact: Jarvis-Desktop-darwin-x64
          - os: ubuntu-latest
            target: linux
            artifact: Jarvis-Desktop-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Electron main process syntax
        run: node --check electron/main.cjs
      - name: Build web app
        run: npm run build
      - name: Package ${{ matrix.target }}
        run: node scripts/dist.cjs --target=${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron-release/*.zip
            electron-release/*.dmg
            electron-release/*.AppImage
            electron-release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(release-assets/**/*.zip release-assets/**/*.dmg release-assets/**/*.AppImage release-assets/**/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release packages were built." >&2
            exit 1
          fi
          TAG="v$(node -p "require('./package.json').version")"
          if [[ "$REF_NAME" == v* && "$REF_NAME" != "$TAG" ]]; then
            echo "Tag $REF_NAME does not match package version $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Adding newly built packages to existing release $TAG."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Jarvis Desktop $TAG" --generate-notes
          fi
